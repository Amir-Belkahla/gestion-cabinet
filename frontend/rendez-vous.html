<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendez-vous — Medicaly</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .filter-bar {
            background: var(--white);
            padding: 25px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
        }

        .filter-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-group .form-control, .filter-group .form-select {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .filter-group .form-control:focus, .filter-group .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.05);
        }

        .toolbar-btns {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .rdv-time {
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .patient-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .patient-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
        }
    </style>
</head>
<body>
<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <i data-lucide="hospital"></i> Medicaly
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Menu Principal</div>
            <a href="dashboard.html" class="nav-item" data-page="dashboard">
                <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Tableau de bord
            </a>
            <a href="patients.html" class="nav-item" data-page="patients" data-role="admin,medecin,secretaire">
                <span class="nav-icon"><i data-lucide="users"></i></span> Patients
            </a>
            <a href="rendez-vous.html" class="nav-item active" data-page="rendez-vous">
                <span class="nav-icon"><i data-lucide="calendar"></i></span> Rendez-vous
            </a>
            <a href="consultations.html" class="nav-item" data-page="consultations" data-role="admin,medecin,patient">
                <span class="nav-icon"><i data-lucide="stethoscope"></i></span> Consultations
            </a>
            <a href="ordonnances.html" class="nav-item" data-page="ordonnances" data-role="admin,medecin,patient">
                <span class="nav-icon"><i data-lucide="pill"></i></span> Ordonnances
            </a>

            <div class="nav-section-title" data-role="admin">Administration</div>
            <a href="utilisateurs.html" class="nav-item" data-page="utilisateurs" data-role="admin">
                <span class="nav-icon"><i data-lucide="user-cog"></i></span> Utilisateurs
            </a>
            <a href="admin.html" class="nav-item" data-page="admin" data-role="admin">
                <span class="nav-icon"><i data-lucide="settings"></i></span> Paramètres
            </a>

            <div class="nav-section-title">Personnel</div>
            <a href="notifications.html" class="nav-item" data-page="notifications">
                <span class="nav-icon"><i data-lucide="bell"></i></span> Notifications
            </a>
            <a href="profil.html" class="nav-item" data-page="profil">
                <span class="nav-icon"><i data-lucide="user"></i></span> Mon profil
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar" id="sb-user-avatar">?</div>
                <div class="user-info">
                    <div class="user-name" id="sb-user-name">...</div>
                    <div class="user-role" id="sb-user-role">...</div>
                </div>
            </div>
            <button onclick="logout()" class="logout-btn">
                <i data-lucide="log-out"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <h2>Gestion des Rendez-vous</h2>
            </div>
            <div class="topbar-right">
                <button class="notif-btn" onclick="location.href='notifications.html'">
                    <i data-lucide="bell"></i>
                    <span class="badge-notif" id="notif-badge" style="display:none">0</span>
                </button>
                <div class="user-greeting">
                    <span id="top-user-name" style="font-weight:700">Utilisateur</span>
                </div>
            </div>
        </header>

        <main class="page-content">
            <div class="filter-bar">
                <div class="filter-group">
                    <label>Date</label>
                    <input type="date" id="filter-date" class="form-control" onchange="loadRdv()">
                </div>
                <div class="filter-group" id="filter-medecin-wrap">
                    <label>Médecin</label>
                    <select id="filter-medecin" class="form-select" onchange="loadRdv()">
                        <option value="">Tous les médecins</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Statut</label>
                    <select id="filter-statut" class="form-select" onchange="loadRdv()">
                        <option value="">Tous les statuts</option>
                        <option value="planifie">Planifié</option>
                        <option value="confirme">Confirmé</option>
                        <option value="annule">Annulé</option>
                        <option value="termine">Terminé</option>
                    </select>
                </div>
                <div class="toolbar-btns">
                    <button class="btn btn-primary" onclick="openRdvModal()" id="btn-new-rdv">
                        <i data-lucide="plus"></i> Nouveau RDV
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date & Heure</th>
                                <th>Patient</th>
                                <th>Médecin</th>
                                <th>Motif</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="rdv-tbody">
                            <tr><td colspan="6" style="text-align:center;padding:100px"><div class="spinner"></div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </main>
    </div>
</div>

<!-- Modal RDV -->
<div class="modal-overlay" id="modal-rdv" onclick="closeRdvModal(event)">
    <div class="modal">
        <div class="modal-header">
            <h3 id="rdv-modal-title">Nouveau Rendez-vous</h3>
            <button class="btn-icon" onclick="closeRdvModal()"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="rdv-id">
            <div class="form-row">
                <div class="form-group" id="patient-group">
                    <label>Patient <span style="color:var(--danger)">*</span></label>
                    <select id="rdv-patient" class="form-select" required></select>
                </div>
                <div class="form-group">
                    <label>Médecin <span style="color:var(--danger)">*</span></label>
                    <select id="rdv-medecin" class="form-select" required></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Date du rendez-vous <span style="color:var(--danger)">*</span></label>
                    <input type="date" id="rdv-date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Motif de visite</label>
                    <input type="text" id="rdv-motif" class="form-control" placeholder="ex: Consultation de suivi">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Heure de début <span style="color:var(--danger)">*</span></label>
                    <input type="time" id="rdv-debut" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Heure de fin <span style="color:var(--danger)">*</span></label>
                    <input type="time" id="rdv-fin" class="form-control" required>
                </div>
            </div>
            <div class="form-group">
                <label>Notes complémentaires</label>
                <textarea id="rdv-notes" class="form-control" rows="3" style="resize:none" placeholder="Notes optionnelles..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline-primary" onclick="closeRdvModal()">Annuler</button>
            <button class="btn btn-primary" onclick="saveRdv()">Enregistrer le RDV</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/rendez_vous.js"></script>
<script>
    if (window.lucide) lucide.createIcons();
    const user = Auth.getUser();
    if(user && document.getElementById('top-user-name')) {
        document.getElementById('top-user-name').textContent = user.prenom;
    }
</script>
</body>
</html>
