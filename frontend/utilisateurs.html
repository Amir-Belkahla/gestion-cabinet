<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateurs — Medicaly</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .role-admin { background: #fee2e2; color: #991b1b; }
        .role-medecin { background: #e0e7ff; color: #3730a3; }
        .role-secretaire { background: #dcfce7; color: #166534; }
        .role-patient { background: #f1f5f9; color: #475569; }

        .user-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-active { background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1); }
        .status-inactive { background: #94a3b8; }

        .toolbar {
            background: var(--white);
            padding: 20px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>
<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <i data-lucide="hospital"></i> Medicaly
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Menu Principal</div>
            <a href="dashboard.html" class="nav-item" data-page="dashboard">
                <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Tableau de bord
            </a>
            <a href="patients.html" class="nav-item" data-page="patients" data-role="admin,medecin,secretaire">
                <span class="nav-icon"><i data-lucide="users"></i></span> Patients
            </a>
            <a href="rendez-vous.html" class="nav-item" data-page="rendez-vous">
                <span class="nav-icon"><i data-lucide="calendar"></i></span> Rendez-vous
            </a>
            <a href="consultations.html" class="nav-item" data-page="consultations" data-role="admin,medecin,patient">
                <span class="nav-icon"><i data-lucide="stethoscope"></i></span> Consultations
            </a>
            <a href="ordonnances.html" class="nav-item" data-page="ordonnances" data-role="admin,medecin,patient">
                <span class="nav-icon"><i data-lucide="pill"></i></span> Ordonnances
            </a>

            <div class="nav-section-title" data-role="admin">Administration</div>
            <a href="utilisateurs.html" class="nav-item active" data-page="utilisateurs" data-role="admin">
                <span class="nav-icon"><i data-lucide="user-cog"></i></span> Utilisateurs
            </a>
            <a href="admin.html" class="nav-item" data-page="admin" data-role="admin">
                <span class="nav-icon"><i data-lucide="settings"></i></span> Paramètres
            </a>

            <div class="nav-section-title">Personnel</div>
            <a href="notifications.html" class="nav-item" data-page="notifications">
                <span class="nav-icon"><i data-lucide="bell"></i></span> Notifications
            </a>
            <a href="profil.html" class="nav-item" data-page="profil">
                <span class="nav-icon"><i data-lucide="user"></i></span> Mon profil
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar" id="sb-user-avatar">?</div>
                <div class="user-info">
                    <div class="user-name" id="sb-user-name">...</div>
                    <div class="user-role" id="sb-user-role">...</div>
                </div>
            </div>
            <button onclick="logout()" class="logout-btn">
                <i data-lucide="log-out"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <h2>Gestion de l'Équipe</h2>
            </div>
            <div class="topbar-right">
                <button class="notif-btn" onclick="location.href='notifications.html'">
                    <i data-lucide="bell"></i>
                    <span class="badge-notif" id="notif-badge" style="display:none">0</span>
                </button>
                <div class="user-greeting">
                    <span id="top-user-name" style="font-weight:700">Utilisateur</span>
                </div>
            </div>
        </header>

        <main class="page-content">
            <div class="toolbar">
                <div class="filter-group">
                    <label style="font-size:0.85rem; font-weight:600; color:var(--text-muted)">Filtrer par rôle :</label>
                    <select id="f-role" class="form-select" onchange="loadUtilisateurs()" style="width:200px">
                        <option value="">Tous les membres</option>
                        <option value="admin">Administrateurs</option>
                        <option value="medecin">Médecins</option>
                        <option value="secretaire">Secrétaires</option>
                        <option value="patient">Patients (Accès portail)</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="openUtilModal()">
                    <i data-lucide="user-plus"></i> Ajouter un membre
                </button>
            </div>

            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Utilisateur</th>
                                <th>Email & Contact</th>
                                <th>Rôle</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="util-tbody">
                            <tr><td colspan="5" style="text-align:center;padding:100px"><div class="spinner"></div></td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </main>
    </div>
</div>

<!-- Modal Utilisateur -->
<div class="modal-overlay" id="modal-util" onclick="closeUtilModal(event)">
    <div class="modal">
        <div class="modal-header">
            <h3 id="util-modal-title">Nouvel Utilisateur</h3>
            <button class="btn-icon" onclick="closeUtilModal()"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="util-id">
            <div class="form-row">
                <div class="form-group">
                    <label>Nom <span style="color:var(--danger)">*</span></label>
                    <input type="text" id="u-nom" class="form-control" placeholder="Nom" required>
                </div>
                <div class="form-group">
                    <label>Prénom <span style="color:var(--danger)">*</span></label>
                    <input type="text" id="u-prenom" class="form-control" placeholder="Prénom" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Email <span style="color:var(--danger)">*</span></label>
                    <input type="email" id="u-email" class="form-control" placeholder="email@exemple.com" required>
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="text" id="u-telephone" class="form-control" placeholder="0550 00 00 00">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Rôle <span style="color:var(--danger)">*</span></label>
                    <select id="u-role" class="form-select" onchange="toggleRoleFields()" required>
                        <option value="">Choisir un rôle…</option>
                        <option value="admin">Administrateur</option>
                        <option value="medecin">Médecin</option>
                        <option value="secretaire">Secrétaire</option>
                        <option value="patient">Patient</option>
                    </select>
                </div>
                <div class="form-group" id="field-mdp">
                    <label>Mot de passe <span style="color:var(--danger)">*</span> <small id="mdp-hint" style="color:var(--text-muted)">(Laisser vide si inchangé)</small></label>
                    <input type="password" id="u-mdp" class="form-control" autocomplete="new-password">
                </div>
            </div>

            <!-- Champs spécifiques Médecin -->
            <div id="medecin-fields" style="display:none; margin-top:20px; padding-top:20px; border-top:1px solid #f1f5f9">
                <div class="form-row">
                    <div class="form-group">
                        <label>Spécialité <span style="color:var(--danger)">*</span></label>
                        <input type="text" id="u-specialite" class="form-control" placeholder="Ex: Cardiologie">
                    </div>
                    <div class="form-group">
                        <label>Numéro d'Ordre</label>
                        <input type="text" id="u-num-ordre" class="form-control" placeholder="Ordre des médecins">
                    </div>
                </div>
            </div>

            <!-- Champs spécifiques Patient -->
            <div id="patient-fields" style="display:none; margin-top:20px; padding-top:20px; border-top:1px solid #f1f5f9">
                <div class="form-row">
                    <div class="form-group">
                        <label>Date de naissance</label>
                        <input type="date" id="u-dob" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Sexe</label>
                        <select id="u-sexe" class="form-select">
                            <option value="">Non précisé</option>
                            <option value="M">Masculin</option>
                            <option value="F">Féminin</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-top:15px">
                    <label>Adresse complète</label>
                    <input type="text" id="u-adresse" class="form-control" placeholder="Adresse du patient">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline-primary" onclick="closeUtilModal()">Annuler</button>
            <button class="btn btn-primary" onclick="saveUtilisateur()">Enregistrer le membre</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/utilisateurs.js"></script>
<script>
    if (window.lucide) lucide.createIcons();
    const user = Auth.getUser();
    if(user && document.getElementById('top-user-name')) {
        document.getElementById('top-user-name').textContent = user.prenom;
    }
</script>
</body>
</html>
