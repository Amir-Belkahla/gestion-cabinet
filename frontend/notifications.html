<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — Medicaly</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .notif-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notif-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid transparent;
            transition: all 0.3s;
            position: relative;
        }

        .notif-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #f1f5f9;
            transform: translateY(-2px);
        }

        .notif-card.unread {
            border-left: 4px solid var(--accent);
            background: #f8faff;
        }

        .notif-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Type specific icons colors */
        .icon-rdv { background: #e0f2fe; color: #0369a1; }
        .icon-consultation { background: #e0e7ff; color: #4338ca; }
        .icon-ordonnance { background: #dcfce7; color: #15803d; }
        .icon-systeme { background: #f1f5f9; color: #475569; }
        .icon-general { background: #fff7ed; color: #c2410c; }

        .notif-content {
            flex: 1;
        }

        .notif-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
            font-size: 1rem;
        }

        .notif-message {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .notif-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .notif-actions {
            display: flex;
            gap: 10px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .unread-indicator {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            top: 15px;
            right: 15px;
        }
    </style>
</head>
<body>
<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <i data-lucide="hospital"></i> Medicaly
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Menu Principal</div>
            <a href="dashboard.html" class="nav-item" data-page="dashboard">
                <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Tableau de bord
            </a>
            <a href="patients.html" class="nav-item" data-page="patients" data-role="admin,medecin,secretaire">
                <span class="nav-icon"><i data-lucide="users"></i></span> Patients
            </a>
            <a href="rendez-vous.html" class="nav-item" data-page="rendez-vous">
                <span class="nav-icon"><i data-lucide="calendar"></i></span> Rendez-vous
            </a>
            <a href="consultations.html" class="nav-item" data-page="consultations" data-role="admin,medecin,patient">
                <span class="nav-icon"><i data-lucide="stethoscope"></i></span> Consultations
            </a>
            <a href="ordonnances.html" class="nav-item" data-page="ordonnances" data-role="admin,medecin,patient">
                <span class="nav-icon"><i data-lucide="pill"></i></span> Ordonnances
            </a>

            <div class="nav-section-title" data-role="admin">Administration</div>
            <a href="utilisateurs.html" class="nav-item" data-page="utilisateurs" data-role="admin">
                <span class="nav-icon"><i data-lucide="user-cog"></i></span> Utilisateurs
            </a>
            <a href="admin.html" class="nav-item" data-page="admin" data-role="admin">
                <span class="nav-icon"><i data-lucide="settings"></i></span> Paramètres
            </a>

            <div class="nav-section-title">Personnel</div>
            <a href="notifications.html" class="nav-item active" data-page="notifications">
                <span class="nav-icon"><i data-lucide="bell"></i></span> Notifications
            </a>
            <a href="profil.html" class="nav-item" data-page="profil">
                <span class="nav-icon"><i data-lucide="user"></i></span> Mon profil
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar" id="sb-user-avatar">?</div>
                <div class="user-info">
                    <div class="user-name" id="sb-user-name">...</div>
                    <div class="user-role" id="sb-user-role">...</div>
                </div>
            </div>
            <button onclick="logout()" class="logout-btn">
                <i data-lucide="log-out"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <h2>Notifications</h2>
            </div>
            <div class="topbar-right">
                <button class="notif-btn" onclick="location.href='notifications.html'">
                    <i data-lucide="bell"></i>
                    <span class="badge-notif" id="notif-badge" style="display:none">0</span>
                </button>
                <div class="user-greeting">
                    <span id="top-user-name" style="font-weight:700">Utilisateur</span>
                </div>
            </div>
        </header>

        <main class="page-content">
            <div class="toolbar">
                <div class="section-title">
                    <p style="color:var(--text-muted); font-size:0.9rem" id="notif-status-text">Chargement des notifications...</p>
                </div>
                <div class="actions">
                    <button class="btn btn-outline-primary" onclick="toutLire()">
                        <i data-lucide="check-check"></i> Tout marquer comme lu
                    </button>
                </div>
            </div>

            <div class="notif-container" id="notif-list">
                <!-- Notifications injectées par JS -->
                <div style="text-align:center;padding:100px"><div class="spinner"></div></div>
            </div>
        </main>
    </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
<script>
    if (window.lucide) lucide.createIcons();
    const user = Auth.getUser();
    if(user && document.getElementById('top-user-name')) {
        document.getElementById('top-user-name').textContent = user.prenom;
    }
</script>
</body>
</html>
