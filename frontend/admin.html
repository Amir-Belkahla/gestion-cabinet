<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration — Medicaly</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .tabs-header {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            padding: 5px;
            background: #f1f5f9;
            border-radius: 12px;
            width: fit-content;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--white);
            color: var(--accent);
            box-shadow: var(--shadow-sm);
        }

        .admin-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .log-action-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 2px 6px;
            background: #f1f5f9;
            border-radius: 4px;
            color: var(--primary);
        }

        .param-item {
            display: grid;
            grid-template-columns: 250px 1fr auto;
            align-items: center;
            gap: 30px;
            padding: 20px 30px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
        }

        .param-item:last-child { border-bottom: none; }
        .param-item:hover { background: #fafafa; }

        .param-label h4 {
            font-size: 0.95rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .param-label p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <i data-lucide="hospital"></i> Medicaly
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Menu Principal</div>
            <a href="dashboard.html" class="nav-item" data-page="dashboard">
                <span class="nav-icon"><i data-lucide="layout-dashboard"></i></span> Tableau de bord
            </a>
            <a href="patients.html" class="nav-item" data-page="patients" data-role="admin,medecin,secretaire">
                <span class="nav-icon"><i data-lucide="users"></i></span> Patients
            </a>
            <a href="rendez-vous.html" class="nav-item" data-page="rendez-vous">
                <span class="nav-icon"><i data-lucide="calendar"></i></span> Rendez-vous
            </a>
            <a href="consultations.html" class="nav-item" data-page="consultations" data-role="admin,medecin,patient">
                <span class="nav-icon"><i data-lucide="stethoscope"></i></span> Consultations
            </a>
            <a href="ordonnances.html" class="nav-item" data-page="ordonnances" data-role="admin,medecin,patient">
                <span class="nav-icon"><i data-lucide="pill"></i></span> Ordonnances
            </a>

            <div class="nav-section-title" data-role="admin">Administration</div>
            <a href="utilisateurs.html" class="nav-item" data-page="utilisateurs" data-role="admin">
                <span class="nav-icon"><i data-lucide="user-cog"></i></span> Utilisateurs
            </a>
            <a href="admin.html" class="nav-item active" data-page="admin" data-role="admin">
                <span class="nav-icon"><i data-lucide="settings"></i></span> Paramètres
            </a>

            <div class="nav-section-title">Personnel</div>
            <a href="notifications.html" class="nav-item" data-page="notifications">
                <span class="nav-icon"><i data-lucide="bell"></i></span> Notifications
            </a>
            <a href="profil.html" class="nav-item" data-page="profil">
                <span class="nav-icon"><i data-lucide="user"></i></span> Mon profil
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <div class="user-avatar" id="sb-user-avatar">?</div>
                <div class="user-info">
                    <div class="user-name" id="sb-user-name">...</div>
                    <div class="user-role" id="sb-user-role">...</div>
                </div>
            </div>
            <button onclick="logout()" class="logout-btn">
                <i data-lucide="log-out"></i> Déconnexion
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <h2>Administration Système</h2>
            </div>
            <div class="topbar-right">
                <button class="notif-btn" onclick="location.href='notifications.html'">
                    <i data-lucide="bell"></i>
                    <span class="badge-notif" id="notif-badge" style="display:none">0</span>
                </button>
                <div class="user-greeting">
                    <span id="top-user-name" style="font-weight:700">Utilisateur</span>
                </div>
            </div>
        </header>

        <main class="page-content">
            <div class="tabs-header">
                <button class="tab-btn active" id="btn-tab-logs" onclick="showTab('logs')">
                    <i data-lucide="list-tree"></i> Journaux système
                </button>
                <button class="tab-btn" id="btn-tab-params" onclick="showTab('params')">
                    <i data-lucide="sliders"></i> Configuration
                </button>
            </div>

            <!-- Onglet Logs -->
            <div id="tab-logs" class="tab-content">
                <div class="admin-card">
                    <div class="toolbar" style="padding:25px 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f1f5f9">
                        <div class="filter-group" style="display:flex; gap:15px">
                            <input type="date" id="f-log-date" class="form-control" style="width:180px" onchange="loadLogs()">
                            <input type="text" id="f-log-action" class="form-control" style="width:250px" placeholder="Filtrer par action (ex: CREATE)..." onkeyup="debounce(loadLogs,400)()">
                        </div>
                        <span id="log-total-text" style="font-size:0.85rem; color:var(--text-muted); font-weight:600"></span>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date & Heure</th>
                                    <th>Utilisateur</th>
                                    <th>Action</th>
                                    <th>Table</th>
                                    <th>IP</th>
                                    <th>Détails</th>
                                </tr>
                            </thead>
                            <tbody id="log-tbody">
                                <tr><td colspan="6" style="text-align:center;padding:100px"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="log-pag"></div>
                </div>
            </div>

            <!-- Onglet Paramètres -->
            <div id="tab-params" class="tab-content" style="display:none">
                <div class="admin-card">
                    <div id="params-list">
                        <!-- Paramètres injectés par JS -->
                        <div style="text-align:center;padding:100px"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script>
    if (window.lucide) lucide.createIcons();
    const user = Auth.getUser();
    if(user && document.getElementById('top-user-name')) {
        document.getElementById('top-user-name').textContent = user.prenom;
    }
</script>
</body>
</html>
